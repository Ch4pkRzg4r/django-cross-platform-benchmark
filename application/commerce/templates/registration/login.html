<!-- ecommerce/commerce/templates/registration/login.html -->
{% extends 'base.html' %}  <!-- This line must be the very first line of the template -->
{% load static %}

{% block content %}
<h2>Sign In</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign IN</button>
</form>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% block title %}Sign In{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <section id="" class="section-p1">
       
        <div class="form-conainer">



            <h2>Login form</h2>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="normal">Login</button>
            </form>   

      
            <p>Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
        </div>
 </div> 

</div>
</div>    

    </section>
</body>
</html>
