# ================================================================
# PostgreSQL 17 Configuration - E-commerce Benchmark
# ================================================================
# ڕێکخستن بۆ ٢,٥٠٠ بەکارهێنەری هاوکات لەگەڵ PgBouncer
# بنەما: https://www.cybertec-postgresql.com/en/tuning-max_connections-in-postgresql/
# ================================================================

# --- Connection Settings ---
listen_addresses = '*'
port = 5432
max_connections = 300
superuser_reserved_connections = 3

# --- Memory Settings ---
# sharedPostgreBuffers = 25% لە RAM (بۆ container ی 8GB)
shared_buffers = 2GB

# effective_cache_size = 75% لە RAM
effective_cache_size = 6GB

# work_mem بۆ هەر query عمل
work_mem = 16MB

# maintenance_work_mem بۆ VACUUM و CREATE INDEX
maintenance_work_mem = 256MB

# --- WAL (Write-Ahead Log) Settings ---
wal_buffers = 16MB
wal_level = replica
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# --- Query Planner ---
random_page_cost = 1.1              # 1.1 بۆ SSD، 4.0 بۆ HDD
effective_io_concurrency = 200      # 200 بۆ SSD
default_statistics_target = 100

# --- Parallel Query ---
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# --- ACID Integrity ---
# بۆ توێژینەوەی ئەکادیمی هەرگیز synchronous_commit=off مەکە
synchronous_commit = on
fsync = on
full_page_writes = on

# --- Logging (بۆ شیکاری benchmark) ---
log_min_duration_statement = 1000   # log queries slower than 1 sec
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_timezone = 'UTC'
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# --- Statistics ---
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl

# --- Autovacuum (بۆ بەرهەمهێنانی بە SSD ئۆپتیمایز) ---
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# --- Timezone ---
timezone = 'UTC'
