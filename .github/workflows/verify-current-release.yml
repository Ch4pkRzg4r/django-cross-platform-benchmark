name: verify-current-release

on:
  push:
    branches: [main, repo-completeness-v365]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: environment/requirements-analysis-v330.txt

      - name: Install analysis dependencies
        run: python -m pip install -r environment/requirements-analysis-v330.txt

      - name: Verify frozen v330 repository state
        run: python verification/verify_v330_repository_state.py

      - name: Install publication font
        run: sudo apt-get update && sudo apt-get install -y fonts-urw-base35

      - name: Regenerate current thesis release
        run: python analysis/run_current_thesis.py --out-dir "${{ runner.temp }}/current-thesis"

      - name: Verify current source identities and reviewed descriptive carriers
        run: python verification/verify_current_thesis.py --out-dir "${{ runner.temp }}/current-thesis"

      - name: Verify v367 strict H4 predicate and figure output integrity
        run: python verification/verify_v367_release.py --out-dir "${{ runner.temp }}/current-thesis/base_layers"

      - name: Compile public application Python
        run: |
          python -m compileall -q application
          python -m json.tool application/datadump.PUBLIC.json > /dev/null

      - name: Ensure historical raw fixture is absent
        shell: bash
        run: |
          test ! -f application/datadump.json
          echo "PASS: raw historical fixture is not committed"

