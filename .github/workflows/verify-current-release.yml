name: verify-current-release

on:
  push:
    branches: [main, repo-completeness-v365]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: environment/requirements-analysis-v330.txt

      - name: Verify v368 correction manifest and protected evidence bytes
        run: python verification/verify_v368_correction.py

      - name: Install analysis dependencies
        run: python -m pip install -r environment/requirements-analysis-v330.txt

      - name: Verify frozen v330 repository state
        run: python verification/verify_v330_repository_state.py

      - name: Verify current v367 release layers
        run: python analysis/run_v367_from_repo.py --out-dir "${{ runner.temp }}/v367-output"

      - name: Verify v367 strict H4 predicate and figure output integrity
        run: python verification/verify_v367_release.py --out-dir "${{ runner.temp }}/v367-output"

      - name: Compile public application Python
        run: |
          python -m compileall -q application
          python -m json.tool application/datadump.PUBLIC.json > /dev/null

      - name: Ensure historical raw fixture is absent
        shell: bash
        run: |
          test ! -f application/datadump.json
          echo "PASS: raw historical fixture is not committed"

