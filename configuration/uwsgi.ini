[uwsgi]
chdir            = /app
module           = ecommerce.wsgi:application
pythonpath       = /app
env              = DJANGO_SETTINGS_MODULE=ecommerce.settings

socket           = 127.0.0.1:3031

master           = true
processes        = 4
threads          = 2
enable-threads   = true
thunder-lock     = true

vacuum           = true
die-on-term      = true
need-app         = true
single-interpreter = true
max-requests     = 5000
harakiri         = 60
buffer-size      = 32768

log-master       = true
disable-logging  = false
log-4xx          = true
log-5xx          = true

uid              = www-data
gid              = www-data

