# PUBLIC DERIVATIVE — source identity preserved in FLY_PUBLIC_PROVENANCE.md
app = "REDACTED_PUBLIC_APP_NAME"
primary_region = "fra"

[build]
image = "chapkrzgar/ecom:2.0"

[deploy]
strategy = "immediate"
wait_timeout = "10m0s"

[env]
SECRET_KEY = "REDACTED_FOR_PUBLIC_RELEASE"
DEBUG = "False"
ALLOWED_HOSTS = "*"
DB_NAME = "ecommerce_benchmark"
DB_USER = "benchuser"
DB_PASSWORD = "REDACTED_FOR_PUBLIC_RELEASE"
DB_HOST = "REDACTED_PUBLIC_ENDPOINT"
DB_PORT = "6432"
DB_CONN_MAX_AGE = "60"
DJANGO_DISABLE_SERVER_SIDE_CURSORS = "True"

[http_service]
auto_start_machines = true
auto_stop_machines = "stop"
force_https = true
internal_port = 8000
min_machines_running = 0
processes = ["app"]

  [[http_service.checks]]
  grace_period = "20s"
  interval = "15s"
  method = "GET"
  path = "/health/"
  protocol = "http"
  timeout = "5s"

[[vm]]
size = "shared-cpu-2x"
memory = "2048mb"
cpus = 2
cpu_kind = "shared"
