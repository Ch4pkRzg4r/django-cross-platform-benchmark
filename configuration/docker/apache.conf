# Apache 2.4 + mod_wsgi event MPM (compiled for Python 3.12 via pip)
ServerName localhost
ServerTokens Prod
ServerSignature Off

<IfModule mpm_event_module>
    StartServers            1
    MinSpareThreads         5
    MaxSpareThreads         25
    ThreadsPerChild         25
    ServerLimit             2
    MaxRequestWorkers       50
    MaxConnectionsPerChild  10000
</IfModule>

ErrorLog ${APACHE_LOG_DIR}/error.log
CustomLog ${APACHE_LOG_DIR}/access.log combined
LogLevel warn

<VirtualHost *:8080>
    DocumentRoot /app

    WSGIDaemonProcess django_app \
        processes=2 \
        threads=4 \
        maximum-requests=1000 \
        request-timeout=30 \
        startup-timeout=15 \
        python-home=/usr/local \
        python-path=/app
    
    WSGIProcessGroup django_app
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /app/ecommerce/wsgi.py
    
    Alias /static/ /app/staticfiles/
    <Directory /app/staticfiles>
        Require all granted
    </Directory>
    
    <Directory /app/ecommerce>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>
    
    WSGIPassAuthorization On
</VirtualHost>
