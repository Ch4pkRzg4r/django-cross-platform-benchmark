# Global directives (NOT in VirtualHost)
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName django-app
    DocumentRoot /app

    WSGIDaemonProcess django_app \
        processes=2 \
        threads=4 \
        python-home=/usr/local \
        python-path=/app \
        display-name=%{GROUP} \
        lang='C.UTF-8' \
        locale='C.UTF-8'

    WSGIProcessGroup django_app
    WSGIScriptAlias / /app/ecommerce/wsgi.py
    WSGIPassAuthorization On
    WSGIApplicationGroup %{GLOBAL}

    <Directory /app/ecommerce>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    Alias /static/ /app/staticfiles/
    <Directory /app/staticfiles>
        Require all granted
    </Directory>

    Alias /media/ /app/media/
    <Directory /app/media>
        Require all granted
    </Directory>

    KeepAlive On
    MaxKeepAliveRequests 10000
    KeepAliveTimeout 15
</VirtualHost>

# REV4 MPM Event tuning - apple-to-apple HTTP acceptance
# Apache MPM threads are JUST HTTP acceptors (mod_wsgi daemon = real workers)
# Sized minimally to forward requests to the 8 WSGI daemon slots
<IfModule mpm_event_module>
    StartServers             1
    MinSpareThreads          2
    MaxSpareThreads          4
    ThreadLimit              4
    ThreadsPerChild          4
    MaxRequestWorkers        8
    MaxConnectionsPerChild   0
    ServerLimit              2
</IfModule>
