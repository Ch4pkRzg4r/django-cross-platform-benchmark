services:
  postgres:
    image: postgres:17-alpine
    container_name: bench_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce_benchmark
      POSTGRES_USER: benchuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchuser -d ecommerce_benchmark"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: bench_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce_benchmark
      DB_USER: benchuser
      DB_PASSWORD: ${DB_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 3000
      DEFAULT_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 3
      SERVER_IDLE_TIMEOUT: 600
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  # Django direct (Gunicorn) - Server 1
  django:
    image: chapkrzgar/ecom:2.0
    container_name: bench_django
    restart: unless-stopped
    environment:
      SECRET_KEY: thesis-bench-v2-apple-to-apple-2026
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DB_NAME: ecommerce_benchmark
      DB_USER: benchuser
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_CONN_MAX_AGE: 60
      DJANGO_DISABLE_SERVER_SIDE_CURSORS: "True"
    ports:
      - "8000:8000"
    depends_on:
      pgbouncer:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # Apache + mod_wsgi (NATIVE WSGI, NOT proxy) - Server 2
  apache:
    image: chapkrzgar/ecom-apache:2.0
    container_name: bench_apache
    restart: unless-stopped
    environment:
      SECRET_KEY: thesis-bench-v2-apple-to-apple-2026
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DB_NAME: ecommerce_benchmark
      DB_USER: benchuser
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_CONN_MAX_AGE: 60
      DJANGO_DISABLE_SERVER_SIDE_CURSORS: "True"
    ports:
      - "8080:80"
    depends_on:
      pgbouncer:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # Nginx + uWSGI (NATIVE WSGI, NOT proxy) - Server 3
  nginx:
    image: chapkrzgar/ecom-nginx:2.0
    container_name: bench_nginx
    restart: unless-stopped
    environment:
      SECRET_KEY: thesis-bench-v2-apple-to-apple-2026
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DB_NAME: ecommerce_benchmark
      DB_USER: benchuser
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_CONN_MAX_AGE: 60
      DJANGO_DISABLE_SERVER_SIDE_CURSORS: "True"
    ports:
      - "8081:80"
    depends_on:
      pgbouncer:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

volumes:
  pgdata:
    driver: local
