[uwsgi]
chdir = /app
module = ecommerce.wsgi:application
pythonpath = /app
env = DJANGO_SETTINGS_MODULE=ecommerce.settings

; Prospective v366 reproduction derivative: matches nginx.conf in this directory.
socket = /run/uwsgi/django.sock
chmod-socket = 660
chown-socket = www-data:www-data

master = true
processes = 2
threads = 4
enable-threads = true
thunder-lock = true

vacuum = true
die-on-term = true
need-app = true
single-interpreter = true
max-requests = 5000
harakiri = 60
buffer-size = 32768

log-master = true
disable-logging = false
log-4xx = true
log-5xx = true

uid = www-data
gid = www-data
